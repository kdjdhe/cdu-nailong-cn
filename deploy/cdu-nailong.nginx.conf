# 成都奶龙大学.cn —— 奶龙引渡处着陆页（首尔 VPS 直接部署，不经过 Cloudflare）
# 域名 punycode: xn--psszg58c53lfp7dgls.cn（成都奶龙大学.cn）
# 站点目录: /var/www/cdu-nailong
# 行为对齐原 CF Worker 版：/ 首页 + /assets/* 静态资产，其余 404；robots 全站 Disallow。
server {
    listen 80;
    listen [::]:80;
    server_name xn--psszg58c53lfp7dgls.cn www.xn--psszg58c53lfp7dgls.cn;

    # certbot 续期挑战直接走文件，其余全部跳 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--psszg58c53lfp7dgls.cn www.xn--psszg58c53lfp7dgls.cn;

    root /var/www/cdu-nailong;
    index index.html;
    charset utf-8;

    # 自签证书仅作过渡：DNS 切到本机后由 certbot --nginx 换成 Let's Encrypt
    ssl_certificate /etc/nginx/ssl/cdu-nailong.crt;
    ssl_certificate_key /etc/nginx/ssl/cdu-nailong.key;

    gzip on;
    gzip_types text/css image/svg+xml application/json;

    # 首页 HTML：与 Worker 版一致的协商缓存（内容不变回 304）
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data: blob: https://xn--psszg58c53lfp7dgls.cn; media-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'" always;
    }

    location = /favicon.ico {
        alias /var/www/cdu-nailong/favicon.svg;
        types { } default_type image/svg+xml;   # alias 下 nginx 按 URI 后缀定型，这里强制 SVG
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location = /favicon.svg {
        alias /var/www/cdu-nailong/favicon.svg;
        types { } default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex" always;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex" always;
    }

    # 馆藏静态资产：1 天缓存，靠 nginx 自带 ETag 做内容变更后的协商兜底
    location /assets/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    # 其余路径一律 404（与 Worker 行为一致；server 级 X-Robots-Tag 仍会带在 404 上）
    # $uri/ 让首页 "/" 能落到 index 指令并内部跳转到 /index.html
    location / { try_files $uri $uri/ =404; }
}
